{{- /* A Hugo Markdown render hook to parse links, opening external links in new tabs. */ -}}
{{- $destURL := urls.Parse .Destination -}}
{{- $isExternal := and $destURL.Host (ne $destURL.Host (urls.Parse site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title}} title="{{ . }}"{{ end }}{{ if $isExternal }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
